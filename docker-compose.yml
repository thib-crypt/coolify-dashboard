# Local: cp .env.example .env, fill it in, then
#   docker compose up -d
# On Coolify itself: point a Docker Compose resource at this repository and set
# the same variables in its UI — see docs/deployment.md.

services:
  dashboard:
    # Published by CI for linux/amd64 and linux/arm64, so deploying does not
    # mean building. Pin a version (`:1.0.0`) if you would rather decide when to
    # upgrade; `:edge` is the current state of main. To build from this working
    # copy instead, comment the line out and uncomment `build:` below.
    image: ghcr.io/thib-crypt/coolify-dashboard:latest
    # build: .
    restart: unless-stopped
    ports:
      # Loopback, because DASHBOARD_PASSWORD is optional and this file cannot
      # know whether you set one. With a password, publishing on 0.0.0.0 or
      # attaching a domain is reasonable; without one, anyone who reaches this
      # port can deploy and stop things — see the README's Security section.
      - "127.0.0.1:8787:8787"
    environment:
      # --- required ---------------------------------------------------------
      COOLIFY_URL: ${COOLIFY_URL:?set COOLIFY_URL, e.g. https://coolify.example.com}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:?set COOLIFY_TOKEN from Security → API Tokens}
      # --- strongly recommended: the dashboard's own password ---------------
      # Empty leaves every route open. Set it before this gets a domain.
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # --- optional: push channel ------------------------------------------
      # Set it, then point Coolify's outgoing webhook at
      # https://<this-host>/app/hooks/coolify?secret=<the same value>
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # --- optional: measured uptime, latency and TLS expiry ---------------
      PROBES_ENABLED: ${PROBES_ENABLED:-true}
      PROBE_APPS: ${PROBE_APPS:-}
      # --- optional: CPU and RAM gauges (Sentinel over SSH) ----------------
      # Mount the key below and give its in-container path here.
      METRICS_SSH_KEY: ${METRICS_SSH_KEY:-}
      METRICS_SERVERS: ${METRICS_SERVERS:-}
    volumes:
      # KPI history and uptime samples. Drop this and both restart from zero.
      - dashboard-data:/data
      # Uncomment together with METRICS_SSH_KEY=/keys/id_dashboard:
      # - ./id_dashboard:/keys/id_dashboard:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/app/health').then(r=>r.json()).then(b=>process.exit(b.service?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  dashboard-data:
